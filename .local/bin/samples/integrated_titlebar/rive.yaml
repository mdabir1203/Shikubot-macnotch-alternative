name: integrated_titlebar

# macOS only: the scene draws across the whole window, under the native
# close, minimize and zoom controls, with no title bar strip of its own.
# Other desktops ignore this block and keep their ordinary frame.
window:
  titleBar: integrated
  # Where the traffic lights sit, in points from the window's top-left corner,
  # centred in the scene's 52pt header. Leave the block out for the stock
  # placement.
  controls:
    x: 16
    y: 19
  # The strip along the top that drags the window where nothing interactive
  # is under the pointer. Left out, it is the strip the controls occupy.
  dragHeight: 52

logs:
  file: build/rive.log
  problems: build/problems.log
