<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Shiku — Interactive Mascot (Studio Production)</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #0D0D0D;
      color: #E8E8E8;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      overflow: hidden;
      /* 4K-quality rendering: smooth scaling + optimized contrast */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      touch-action: none;
    }
    /* 4K canvas: internal resolution is 2x (1024×1024 on retina),
       CSS scales to display size for sub-pixel precision + crisp edges */
    #background-canvas, #rive-canvas, #particles-canvas {
      position: absolute;
      width: min(72vmin, 512px);
      height: min(72vmin, 512px);
      top: 40%; left: 50%;
      transform: translate(-50%, -50%);
    }
    #background-canvas { z-index: 0; pointer-events: none; }
    #rive-canvas { z-index: 1; }
    #particles-canvas { z-index: 2; pointer-events: none; }
    .hint {
      position: fixed; top: 14px; left: 50%;
      transform: translateX(-50%);
      font-size: 10px; opacity: 0.35;
      letter-spacing: 0.06em;
      pointer-events: none;
      z-index: 3;
      text-transform: uppercase;
    }
    .state-badge {
      position: fixed;
      top: 14px; left: 14px;
      font-size: 10px;
      font-family: ui-monospace, monospace;
      padding: 3px 7px;
      background: rgba(217, 91, 43, 0.2);
      border: 1px solid rgba(240, 138, 63, 0.3);
      border-radius: 3px;
      z-index: 3;
      pointer-events: none;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .state-badge .value { color: #F08A3F; font-weight: 600; }
  </style>
  <script type="module" crossorigin src="./assets/index-C03lOII9.js"></script>
</head>
<body>
  <main class="stage">
    <canvas id="background-canvas" width="1024" height="1024"></canvas>
    <canvas id="rive-canvas" width="1024" height="1024"></canvas>
    <canvas id="particles-canvas" width="1024" height="1024"></canvas>
  </main>
  <p class="hint">tap to poke · double-tap for excited · long-press to pet · swipe for surprise</p>
  <div class="state-badge">mood: <span class="value" id="state-value">—</span></div>

  <script src="./rive-basic.js"></script>
  <script>
    // State badge updater
    function updateBadge() {
      if (window.shiku) {
        document.getElementById('state-value').textContent = window.shiku.state;
      }
      requestAnimationFrame(updateBadge);
    }
    updateBadge();
  </script>
</body>
</html>
