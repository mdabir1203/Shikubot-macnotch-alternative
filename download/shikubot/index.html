<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>Shiku</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #0A0A0A;
      color: #E8E8E8;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      overflow: hidden;
      image-rendering: -webkit-optimize-contrast;
    }
    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      touch-action: none;
    }
    /* Logo canvas: fills 90% of viewport (min dimension), centered.
       Internal resolution 1024×1024 for 4K-quality on retina. */
    #background-canvas, #rive-canvas, #particles-canvas {
      position: absolute;
      width: min(90vmin, 1024px);
      height: min(90vmin, 1024px);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    #background-canvas { z-index: 0; pointer-events: none; }
    #rive-canvas { z-index: 1; }
    #particles-canvas { z-index: 2; pointer-events: none; }
    /* Subtle wordmark — bottom center, very low opacity (boutique minimal) */
    .wordmark {
      position: fixed;
      bottom: 5vh; left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      opacity: 0.25;
      color: #E8E8E8;
      pointer-events: none;
      z-index: 3;
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%233A8B5C'/></svg>" />
  <script type="module" crossorigin src="./assets/index-B93ZZKkj.js"></script>
</head>
<body>
  <main class="stage">
    <canvas id="background-canvas" width="1024" height="1024"></canvas>
    <canvas id="rive-canvas" width="1024" height="1024"></canvas>
    <canvas id="particles-canvas" width="1024" height="1024"></canvas>
  </main>
  <p class="wordmark">Shiku</p>

  <script src="./rive-basic.js"></script>
</body>
</html>
