<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Shiku — Interactive Mascot (Private Showcase)</title>
  <style>
    /* Minimal styling — the .riv fills its canvas, particles draw on top */
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #1D1D1D;
      color: #E8E8E8;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      overflow: hidden;
    }
    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      touch-action: none; /* brain owns pointer perception */
    }
    #rive-canvas, #particles-canvas {
      position: absolute;
      width: min(80vmin, 512px);
      height: min(80vmin, 512px);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    #rive-canvas { z-index: 1; }
    #particles-canvas { z-index: 2; pointer-events: none; }
    .hint {
      position: fixed; bottom: 12px; left: 50%;
      transform: translateX(-50%);
      font-size: 11px; opacity: 0.5;
      letter-spacing: 0.04em;
      pointer-events: none;
      z-index: 3;
    }
  </style>
</head>
<body>
  <main class="stage">
    <canvas id="rive-canvas" width="512" height="512"></canvas>
    <canvas id="particles-canvas" width="512" height="512"></canvas>
  </main>
  <p class="hint">move the mouse · click to poke · type shiku.go('startled') in console</p>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
